name: Hello World from workflow dispatch #pipeline#

on:
  pull_request: #triggers based on events#
    branches:
      - main   #Filters#
  workflow_dispatch: 

jobs:                  # stages#
  job1:          #stage#
    runs-on: ubuntu-slim #agent and in github we call it as runner#
    steps:
      - name: say Hello
        run: echo "Hello world from test4 branch"
      - name: show system info
        run: uname -a

  job2:
    runs-on: ubuntu-latest 
    steps:
      - name: hello from ubuntu latest job 2
        run: echo "hello from ubuntu latest job 2"
      - name: show system info
        run: uname -a

  job3:
    runs-on: ubuntu-latest 
    steps:
      - name: hello from ubuntu latest job3
        run: echo "hello from ubuntu latest job 3"
      - name: show system info
        run: uname -a
