name: Clone Private-repo

on:
  pull_request: 
    branches:
      - main
  workflow_dispatch: 

env:
  REPO: sayabugarisaikiran/streamflix-app

jobs:
  clone-repo:
    runs-on: ubuntu-latest
    steps:
      - name: clone the private repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "cloning the private repo"
          git clone "$REPO"
          echo "key Value: $GH_TOKEN"
          cd "streamflix-app"
          ls -lrt

  clone-repo-with-actions:
    runs-on: ubuntu-latest
    steps:
      - name: clone the repo
        uses: actions/checkout@v4
        with:
          repository: "$REPO"
          token: ${{ secrets.GH_TOKEN }}
      - name: show current directory
        run: pwd
      - name: List all the files
        run: ls -lrt
